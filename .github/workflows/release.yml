name: Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match package version' }
      - run: npm test
      - run: npm run format:check
      - run: npm run build:portable
      - shell: pwsh
        run: |
          Copy-Item README.md dist/win-unpacked/README.md
          Copy-Item LICENSE dist/win-unpacked/LICENSE
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath BarrageReminder-Windows-x64.zip
          $hash = (Get-FileHash BarrageReminder-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  BarrageReminder-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: BarrageReminder-Windows-x64
          path: |
            BarrageReminder-Windows-x64.zip
            SHA256SUMS.txt
      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" BarrageReminder-Windows-x64.zip SHA256SUMS.txt --title "弹幕提醒 $env:RELEASE_TAG" --notes-file RELEASE_NOTES.md
