name: Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:portable
      - shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/* -DestinationPath BarrageReminder-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BarrageReminder-Windows-x64
          path: BarrageReminder-Windows-x64.zip
      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" BarrageReminder-Windows-x64.zip --generate-notes
