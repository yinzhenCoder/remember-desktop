<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"
    />
    <title>桌面提醒</title>
    <link rel="stylesheet" href="overlay.css" />
    <link rel="stylesheet" href="motion.css" />
  </head>
  <body>
    <div id="barrage" hidden>
      <div class="bullet"></div>
      <div class="bullet"></div>
      <div class="bullet"></div>
    </div>
    <section id="confirmation" hidden aria-label="提醒确认">
      <div class="top">
        <span id="symbol"></span>
        <div class="copy">
          <div id="title"></div>
          <small id="detail"></small>
        </div>
        <button id="dismiss" aria-label="关闭提醒，不确认">×</button>
      </div>
      <div class="bottom">
        <span id="remaining"></span
        ><button id="acknowledge">知道了 <span>✓</span></button>
      </div>
    </section>
    <script src="icons.js"></script>
    <script src="motion.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
